# ============================================================
# keymapper.conf
# Wayland replacement for imwheel
#
# Original .imwheelrc translated to keymapper syntax.
#
# Mouse button equivalents:
#   Thumb1 = ButtonBack
#   Thumb2 = ButtonForward
#
# Wheel equivalents:
#   Up   = WheelUp
#   Down = WheelDown
#
# Modifier equivalents:
#   Control_L = Control
#   Shift_L   = Shift
#   Alt_L     = Alt
#   Super_L   = Meta
#   Caps_Lock = CapsLock
# ============================================================
#
# ------------------------------------------------------------
# Mouse wheel
# ------------------------------------------------------------
# Preserve Ctrl+wheel and Shift+wheel behavior.
# These rules must precede the unmodified wheel mappings.
Control{WheelUp}   >> Control{WheelUp}
Control{WheelDown} >> Control{WheelDown}
Shift{WheelUp}     >> Shift{WheelUp}
Shift{WheelDown}   >> Shift{WheelDown}
# Normal wheel: emit three wheel events per input event.
WheelUp   >> repeat[WheelUp, 3]
WheelDown >> repeat[WheelDown, 3]

# ------------------------------------------------------------
# Mouse side buttons
# ------------------------------------------------------------
# ButtonBack = Thumb1
# ButtonForward = Thumb2
# Alt + ButtonForward -> Ctrl+Alt+L
Control{ButtonForward} >> Enter
CapsLock{ButtonForward} >> Enter
# Alt + ButtonForward -> Ctrl+Alt+L
Alt{ButtonForward} >> (Control Alt){L}
# Ctrl + ButtonBack -> Ctrl+Alt+B
Control{ButtonBack} >> (Control Alt){B}

#open console
# CapsLock + ButtonBack -> Super+R
CapsLock{ButtonBack} >> Meta{R}
#open alt console - collides with MUA 'send email now'
#Control{ButtonBack} >> Ctrl{Enter}
#open keepass
# Alt + ButtonBack -> Super+K
Alt{ButtonBack} >> Meta{K}
#open settings
# Super + ButtonBack -> Super+I
Meta{ButtonBack} >> Meta{I}

# ------------------------------------------------------------
# Default side-button behavior
# ------------------------------------------------------------
# ButtonBack -> Alt+Left (browser back)
ButtonBack >> Alt{ArrowLeft}
# ButtonForward -> Alt+Right (browser forward)
ButtonForward >> Alt{ArrowRight}
